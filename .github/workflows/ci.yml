name: CI

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev
    paths:
      - 'src/**'
      - 'custom_components/**'
      - 'tests/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'rollup.config.js'
      - 'rollup.config.helper.mjs'
      - 'release.config.mjs'
      - 'scripts/**'
      - 'eslint.config.mjs'
      - 'tsconfig.json'
      - 'hacs.json'
      - '.github/workflows/**'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: astral-sh/ruff-action@v3
        with:
          args: check custom_components/sidebar_organizer tests/backend
      - run: pnpm run verify
