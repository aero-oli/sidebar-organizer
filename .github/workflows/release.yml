name: Release

on: workflow_dispatch

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release:
    strategy:
      matrix:
        node-version: [22.x]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev'
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix['node-version'] }}
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install backend test dependencies
        run: python3 -m pip install -r tests/backend/requirements.txt
      - name: Verify
        run: pnpm run verify
      - name: Ruff
        uses: astral-sh/ruff-action@v3
        with:
          version: 0.15.17
          args: check custom_components/sidebar_organizer tests/backend
      - name: Check clean generated bundle
        run: test -z "$(git status --porcelain -- custom_components/sidebar_organizer/frontend)"
      - name: Release
        run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
